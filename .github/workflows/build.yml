name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        if: runner.os != 'Windows'
        run: ./code/scripts/build.sh --gurobi off
      - name: Build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: call code\scripts\build.bat --gurobi off
      - name: Test run launchers
        if: runner.os != 'Windows'
        run: |
          ./code/scripts/run_examples.sh --output-dir build/launcher-smoke
          ./code/scripts/run_examples.sh --output-dir build/launcher-smoke
          mkdir -p "build/relative launcher"
          cp data/instances/otto/n_0020/instance_n=20_1.txt \
            "build/relative launcher/local-instance.txt"
          test -f "build/relative launcher/local-instance.txt"
          (
            cd "build/relative launcher"
            ../../code/scripts/run_batch.sh \
              --problem bpp-p \
              --input local-instance.txt \
              --time-limit 10 \
              --output-dir "relative output"
          )
      - name: Test Windows examples
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call code\scripts\run_examples.bat --output-dir build\launcher-smoke
          if errorlevel 1 exit /b 1
          call code\scripts\run_examples.bat --output-dir build\launcher-smoke
          if errorlevel 1 exit /b 1
      - name: Test Windows batch launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call code\scripts\run_batch.bat --problem bpp-p --input data\instances\otto\n_0020\instance_n=20_1.txt --time-limit 10 --output-dir "build\batch launcher smoke"
          if errorlevel 1 exit /b 1
