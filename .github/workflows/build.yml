name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build and test
        if: runner.os != 'Windows'
        run: ./code/scripts/build.sh --gurobi off
      - name: Build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: call code\scripts\build.bat --gurobi off
      - name: Test batch pairing
        run: python code/scripts/test_run_batch.py
